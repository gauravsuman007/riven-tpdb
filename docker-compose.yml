services:
    riven:
        image: ghcr.io/gauravsuman007/riven-tpdb:latest
        container_name: riven
        restart: unless-stopped
        ports:
            - "8080:8080"
        tty: true
        cap_add:
            - SYS_ADMIN
        security_opt:
            - apparmor:unconfined
        shm_size: 1024m
        devices:
            - /dev/fuse
        environment:
            - PUID=1000
            - PGID=1000
            - TZ=America/New_York
            - RIVEN_FORCE_ENV=true
            # Database connection string (full SQLAlchemy URL).
            - RIVEN_DATABASE_HOST=postgresql+psycopg2://postgres:postgres@riven_postgres/riven
            # Must match the container-side path of the /mount volume below,
            # otherwise RivenVFS falls back to the placeholder default.
            - RIVEN_FILESYSTEM_MOUNT_PATH=/mount
            # ThePornDB API token. Optional: leave unset and enter it in the UI
            # instead. An empty value is ignored rather than forced, so it does
            # not pin the field.
            - RIVEN_TPDB_API_TOKEN=${RIVEN_TPDB_API_TOKEN:-}
            #
            # NOTE: do not add RIVEN_* variables here for anything editable in
            # the settings UI. RIVEN_FORCE_ENV=true re-applies every non-empty
            # variable on each settings load, so a variable with a hardcoded
            # fallback (e.g. `${VAR:-false}`) silently overwrites whatever you
            # save and the setting appears to "not stick". Only genuine
            # container infrastructure belongs above.
        healthcheck:
            test: curl -s http://localhost:8080 >/dev/null || exit 1
            interval: 30s
            timeout: 10s
            retries: 10
        volumes:
            - /path/to/riven/data:/riven/data
            - /path/to/riven/mount:/mount:rshared,z
            # How the VPN tab reads tunnel status and drives login and
            # exit-node selection. Read-write, and it has to be: connecting to
            # a unix socket requires write access, so a :ro mount here would
            # leave status working and every control action failing.
            # Harmless when the tailscale service is not running -- the socket
            # is simply absent and the VPN reports itself unreachable.
            - tailscale-sock:/var/run/tailscale
        depends_on:
            riven_postgres:
                condition: service_healthy

    # The web UI is a separate application; the backend above serves only the
    # JSON API. Its settings form is rendered from the backend's JSON schema,
    # so the TPDB section appears automatically -- no TPDB-specific frontend
    # build is required. Use the :dev tag: :latest is a much older build that
    # predates RivenVFS and fails on this schema.
    riven-frontend:
        # The fork: upstream's frontend browses TMDB and would show mainstream
        # movies and TV regardless of what this backend serves.
        image: ghcr.io/gauravsuman007/riven-tpdb-frontend:latest
        container_name: riven-tpdb-frontend
        restart: unless-stopped
        tty: true
        environment:
            - TZ=America/New_York
            # The URL you browse to; used for auth and CSRF checks.
            - ORIGIN=http://localhost:3000
            - BACKEND_URL=http://riven:8080
            # Backend api_key, found in data/settings.json after first start.
            - BACKEND_API_KEY=${BACKEND_API_KEY:?set BACKEND_API_KEY in .env}
            # openssl rand -base64 32
            - AUTH_SECRET=${AUTH_SECRET:?set AUTH_SECRET in .env}
            - DATABASE_URL=/riven/data/riven.db
            # Allow creating the first account; disable once registered.
            - ENABLE_EMAIL_PASSWORD_SIGNUP=true
        ports:
            - "3000:3000"
        volumes:
            - ./frontend-data:/riven/data
        depends_on:
            riven:
                condition: service_started


    # Optional. Only needed if you switch on Settings -> VPN; the backend
    # works normally without this service, and everything except the streaming
    # -site scrapers always goes out directly regardless.
    #
    # Userspace networking is the whole reason this can be selective. In
    # kernel mode tailscaled would capture the backend's entire routing table
    # -- TPDB, the debrid provider, the indexers, the library scan -- and
    # there would be no way to route only the scrapers. Here it routes
    # nothing by itself and instead offers a SOCKS5 proxy that the backend
    # points selected traffic at.
    tailscale:
        image: tailscale/tailscale:latest
        container_name: riven-tailscale
        hostname: riven-tpdb
        restart: unless-stopped
        environment:
            - TS_USERSPACE=true
            - TS_STATE_DIR=/var/lib/tailscale
            # Bind on all interfaces: the backend reaches this over the
            # compose network, not from inside this container.
            - TS_SOCKS5_SERVER=0.0.0.0:1055
            - TS_OUTBOUND_HTTP_PROXY_LISTEN=0.0.0.0:1055
            # Leave unset to log in interactively from Settings -> VPN. An
            # auth key entered in the UI is stored by the backend instead, so
            # do not add a hardcoded fallback here.
            - TS_AUTHKEY=${TS_AUTHKEY:-}
        volumes:
            - ./tailscale-state:/var/lib/tailscale
            # Shared so the backend can drive login and exit-node selection
            # over tailscaled's control socket. Without this the tunnel can
            # still come up from TS_AUTHKEY, but the VPN tab cannot manage it.
            - tailscale-sock:/var/run/tailscale
        # Deliberately no NET_ADMIN and no /dev/net/tun: userspace mode needs
        # neither, and granting them invites someone to "fix" it into kernel
        # mode later, which would silently route everything.

    riven_postgres:
        image: postgres:17-alpine
        container_name: riven-db
        environment:
            - PGDATA=/var/lib/postgresql/data/pgdata
            - POSTGRES_USER=postgres
            - POSTGRES_PASSWORD=postgres
            - POSTGRES_DB=riven
        volumes:
            - /path/to/riven/db:/var/lib/postgresql/data/pgdata
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres"]
            interval: 10s
            timeout: 5s
            retries: 5

    jellyfin:
        image: jellyfin/jellyfin
        container_name: jellyfin
        user: 1000:1000
        restart: unless-stopped
        ports:
        - "8096:8096"
        volumes:
        - /path/to/jellyfin/config:/config
        - /path/to/riven/mount:/mount:rslave,z

volumes:
    # Carries only tailscaled's control socket between the two containers.
    tailscale-sock:
