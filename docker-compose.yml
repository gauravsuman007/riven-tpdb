services:
    riven:
        image: ghcr.io/gauravsuman007/riven-tpdb:latest
        container_name: riven
        restart: unless-stopped
        ports:
            - "8080:8080"
        tty: true
        cap_add:
            - SYS_ADMIN
        security_opt:
            - apparmor:unconfined
        shm_size: 1024m
        devices:
            - /dev/fuse
        environment:
            - PUID=1000
            - PGID=1000
            - TZ=America/New_York
            - RIVEN_FORCE_ENV=true
            # Database connection string (full SQLAlchemy URL).
            - RIVEN_DATABASE_HOST=postgresql+psycopg2://postgres:postgres@riven_postgres/riven
            # Must match the container-side path of the /mount volume below,
            # otherwise RivenVFS falls back to the placeholder default.
            - RIVEN_FILESYSTEM_MOUNT_PATH=/mount
            # ThePornDB metadata (set RIVEN_TPDB_API_TOKEN in a .env file next to this compose).
            - RIVEN_TPDB_ENABLED=true
            - RIVEN_TPDB_API_TOKEN=${RIVEN_TPDB_API_TOKEN:-}
            # TPDB site subscriptions (studios/networks to index).
            - RIVEN_CONTENT_TPDB_ENABLED=true
            - RIVEN_CONTENT_TPDB_SITES=${RIVEN_CONTENT_TPDB_SITES:-[]}
            # Adult trackers (enable one and point at your Prowlarr/Jackett).
            - RIVEN_SCRAPING_PROWLARR_ENABLED=${RIVEN_SCRAPING_PROWLARR_ENABLED:-false}
            - RIVEN_SCRAPING_PROWLARR_URL=${RIVEN_SCRAPING_PROWLARR_URL:-http://localhost:9696}
            - RIVEN_SCRAPING_PROWLARR_API_KEY=${RIVEN_SCRAPING_PROWLARR_API_KEY:-}
            - RIVEN_SCRAPING_JACKETT_ENABLED=${RIVEN_SCRAPING_JACKETT_ENABLED:-false}
            - RIVEN_SCRAPING_JACKETT_URL=${RIVEN_SCRAPING_JACKETT_URL:-http://localhost:9117}
            - RIVEN_SCRAPING_JACKETT_API_KEY=${RIVEN_SCRAPING_JACKETT_API_KEY:-}
        healthcheck:
            test: curl -s http://localhost:8080 >/dev/null || exit 1
            interval: 30s
            timeout: 10s
            retries: 10
        volumes:
            - /path/to/riven/data:/riven/data
            - /path/to/riven/mount:/mount:rshared,z
        depends_on:
            riven_postgres:
                condition: service_healthy

    # The web UI is a separate application; the backend above serves only the
    # JSON API. Its settings form is rendered from the backend's JSON schema,
    # so the TPDB section appears automatically -- no TPDB-specific frontend
    # build is required. Use the :dev tag: :latest is a much older build that
    # predates RivenVFS and fails on this schema.
    riven-frontend:
        image: ghcr.io/rivenmedia/riven-frontend:dev
        container_name: riven-frontend
        restart: unless-stopped
        tty: true
        environment:
            - TZ=America/New_York
            # The URL you browse to; used for auth and CSRF checks.
            - ORIGIN=http://localhost:3000
            - BACKEND_URL=http://riven:8080
            # Backend api_key, found in data/settings.json after first start.
            - BACKEND_API_KEY=${BACKEND_API_KEY:?set BACKEND_API_KEY in .env}
            # openssl rand -base64 32
            - AUTH_SECRET=${AUTH_SECRET:?set AUTH_SECRET in .env}
            - DATABASE_URL=/riven/data/riven.db
            # Allow creating the first account; disable once registered.
            - ENABLE_EMAIL_PASSWORD_SIGNUP=true
        ports:
            - "3000:3000"
        volumes:
            - ./frontend-data:/riven/data
        depends_on:
            riven:
                condition: service_started


    riven_postgres:
        image: postgres:17-alpine
        container_name: riven-db
        environment:
            - PGDATA=/var/lib/postgresql/data/pgdata
            - POSTGRES_USER=postgres
            - POSTGRES_PASSWORD=postgres
            - POSTGRES_DB=riven
        volumes:
            - /path/to/riven/db:/var/lib/postgresql/data/pgdata
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres"]
            interval: 10s
            timeout: 5s
            retries: 5

    jellyfin:
        image: jellyfin/jellyfin
        container_name: jellyfin
        user: 1000:1000
        restart: unless-stopped
        ports:
        - "8096:8096"
        volumes:
        - /path/to/jellyfin/config:/config
        - /path/to/riven/mount:/mount:rslave,z
