services:
    riven:
        image: ghcr.io/gauravsuman007/riven-tpdb:latest
        container_name: riven
        restart: unless-stopped
        ports:
            - "8080:8080"
        tty: true
        cap_add:
            - SYS_ADMIN
        security_opt:
            - apparmor:unconfined
        shm_size: 1024m
        devices:
            - /dev/fuse
        environment:
            - PUID=1000
            - PGID=1000
            - TZ=America/New_York
            - RIVEN_FORCE_ENV=true
            # Database connection string (full SQLAlchemy URL).
            - RIVEN_DATABASE_HOST=postgresql+psycopg2://postgres:postgres@riven_postgres/riven
            # Must match the container-side path of the /mount volume below,
            # otherwise RivenVFS falls back to the placeholder default.
            - RIVEN_FILESYSTEM_MOUNT_PATH=/mount
            # Where RivenVFS caches downloaded chunks. The default is
            # /dev/shm/riven-cache -- a tmpfs, i.e. RAM, capped by shm_size
            # (1 GiB) while cache_max_size_mb defaults to 10 GiB: the cache
            # believes it has ten times the room it actually has, and every
            # cached byte is a byte the host cannot use for anything else.
            # Pointing it at the ./cache bind below puts it on disk, where the
            # configured size is real. Must match the container-side path of
            # that volume, and is pinned here rather than left to the UI so
            # the two can never drift apart.
            - RIVEN_FILESYSTEM_CACHE_DIR=/riven/cache
            # Local copies of titles kept with the "Keep on disk" button.
            # Leave unset to manage the path from the settings UI instead;
            # empty disables the feature and hides the button.
            - RIVEN_FILESYSTEM_LOCAL_DOWNLOAD_PATH=/riven/downloads
            # ThePornDB API token. Optional: leave unset and enter it in the UI
            # instead. An empty value is ignored rather than forced, so it does
            # not pin the field.
            - RIVEN_TPDB_API_TOKEN=${RIVEN_TPDB_API_TOKEN:-}
            #
            # NOTE: do not add RIVEN_* variables here for anything editable in
            # the settings UI. RIVEN_FORCE_ENV=true re-applies every non-empty
            # variable on each settings load, so a variable with a hardcoded
            # fallback (e.g. `${VAR:-false}`) silently overwrites whatever you
            # save and the setting appears to "not stick". Only genuine
            # container infrastructure belongs above.
        healthcheck:
            test: curl -s http://localhost:8080 >/dev/null || exit 1
            interval: 30s
            timeout: 10s
            retries: 10
        volumes:
            - /path/to/riven/data:/riven/data
            - /path/to/riven/mount:/mount:rshared,z
            # RivenVFS chunk cache, matching RIVEN_FILESYSTEM_CACHE_DIR above.
            # Purely disposable: deleting it costs re-fetching chunks from the
            # debrid provider, nothing more.
            - ./cache:/riven/cache
            # Where "Keep on disk" writes. Must match
            # filesystem.local_download_path (settable as
            # RIVEN_FILESYSTEM_LOCAL_DOWNLOAD_PATH); the feature stays off
            # until that setting names a writable directory. Unlike the cache
            # above this is NOT disposable -- it is the only copy of a kept
            # title that does not depend on the debrid account.
            - ./downloads:/riven/downloads
            # How the VPN tab reads tunnel status and drives login and
            # exit-node selection. Read-write, and it has to be: connecting to
            # a unix socket requires write access, so a :ro mount here would
            # leave status working and every control action failing.
            # Harmless when the tailscale service is not running -- the socket
            # is simply absent and the VPN reports itself unreachable.
            - tailscale-sock:/var/run/tailscale
            # Drop a scraper plugin .py file here and click "Rescan folder"
            # on Settings -> Plugins to pick it up -- see README.md for the
            # interface it needs to implement. Read-only: this container only
            # ever reads plugin files, never writes to the folder.
            - ./plugins:/riven/plugins:ro
            # The OnlyFans performer-index scrapers, from the onlyfans_scrapers
            # repo. A separate folder from ./plugins above, not a second copy
            # of it: those answer "find me this title", these answer "who does
            # this site carry", and the app keeps two registries so an OnlyFans
            # scraper never appears in the direct-play site list. Managed from
            # Settings -> OnlyFans.
            #
            # NOT read-only, unlike ./plugins: that tab can import a scraper
            # file, which writes into this folder.
            - ./onlyfans_scrapers:/riven/onlyfans_scrapers
        depends_on:
            riven_postgres:
                condition: service_healthy

    # Clears a stale RivenVFS mount so the backend above can start.
    #
    # THE PROBLEM. `/mount` is bound `rshared`, which is not optional -- it
    # is what lets Jellyfin (below) see a filesystem that RivenVFS mounts
    # inside another container. The cost is that the mount escapes to the
    # host, and if the backend then dies without unmounting -- a crash, a
    # SIGKILL, the docker daemon stopping underneath it -- the mount outlives
    # it there as a dead endpoint.
    #
    # From then on the daemon cannot stat the bind source, so it refuses to
    # create the container at all:
    #
    #     invalid mount config for type "bind": stat /path/to/riven/mount:
    #     transport endpoint is not connected
    #
    # `restart: unless-stopped` then makes it permanent rather than
    # self-limiting: every retry fails the same way, forever, and because the
    # failure is on the daemon side there is nothing in the backend's own log
    # to read. Observed on the server at 118 consecutive failures overnight
    # after a daemon restart. Nothing recovers on its own, and no guard
    # inside the backend image can help -- that image never gets to run.
    #
    # THE FIX. Bind the PARENT directory instead. Docker never stats the
    # children of a bind source, so this container starts when the backend
    # cannot, and `rshared` -- the same propagation that leaked the mount out
    # -- carries the unmount back to the host. The backend's own restart
    # policy then does the rest, with no ordering between the two required.
    #
    # DETECTION: read the directory (`ls -A`), never merely stat it. A dead
    # endpoint has two observable states and only one of them fails to stat.
    # Measured on the server, on the same orphaned mount:
    #
    #     ls -d .../library   ->  succeeds, prints the path
    #     ls -A .../library   ->  transport endpoint is not connected
    #
    # So `[ -d ]`, `test -e` and `ls -d` all report a dead mount as perfectly
    # healthy, and a guard built on any of them silently does nothing. The
    # daemon hits the same split, which is why the backend sometimes fails to
    # be created and sometimes starts onto a library it cannot read.
    #
    # Deliberately no `timeout` around it: a hung but LIVE mount blocks the
    # read, and blocking is the safe outcome -- a timeout would turn that
    # hang into a false positive and unmount a filesystem still serving.
    riven-mountguard:
        image: alpine:3
        container_name: riven-mountguard
        restart: unless-stopped
        # Only to unmount. Notably NOT privileged, and no /dev/fuse.
        cap_add:
            - SYS_ADMIN
        environment:
            # The final path segment of the /mount bind source below.
            - MOUNT_NAME=mount
        volumes:
            # The PARENT of the backend's /mount bind source. Binding the
            # mount point itself would fail for the very reason this exists.
            - /path/to/riven:/host:rshared
        command:
            - sh
            - -c
            - |
                echo "Watching /host/$$MOUNT_NAME for a stale FUSE mount."
                while true; do
                    if ! ls -A "/host/$$MOUNT_NAME" > /dev/null 2>&1; then
                        echo "$$(date -Is) stale mount at $$MOUNT_NAME, clearing"
                        umount -l "/host/$$MOUNT_NAME" 2>/dev/null || true
                        mkdir -p "/host/$$MOUNT_NAME" 2>/dev/null || true
                        if ls -A "/host/$$MOUNT_NAME" > /dev/null 2>&1; then
                            echo "cleared; the backend can start again"
                        else
                            echo "STILL UNREADABLE -- needs a look"
                        fi
                    fi
                    sleep 15
                done

    # The web UI is a separate application; the backend above serves only the
    # JSON API. Its settings form is rendered from the backend's JSON schema,
    # so the TPDB section appears automatically -- no TPDB-specific frontend
    # build is required. Use the :dev tag: :latest is a much older build that
    # predates RivenVFS and fails on this schema.
    riven-frontend:
        # The fork: upstream's frontend browses TMDB and would show mainstream
        # movies and TV regardless of what this backend serves.
        image: ghcr.io/gauravsuman007/riven-tpdb-frontend:latest
        container_name: riven-tpdb-frontend
        restart: unless-stopped
        tty: true
        environment:
            - TZ=America/New_York
            # The URL you browse to; used for auth and CSRF checks.
            - ORIGIN=http://localhost:3000
            - BACKEND_URL=http://riven:8080
            # Backend api_key, found in data/settings.json after first start.
            - BACKEND_API_KEY=${BACKEND_API_KEY:?set BACKEND_API_KEY in .env}
            # openssl rand -base64 32
            - AUTH_SECRET=${AUTH_SECRET:?set AUTH_SECRET in .env}
            - DATABASE_URL=/riven/data/riven.db
            # Allow creating the first account; disable once registered.
            - ENABLE_EMAIL_PASSWORD_SIGNUP=true
            # Answer the Jellyfin client protocol at this same address, for
            # the official Android/webOS apps and TV clients. Off by default;
            # password is always BACKEND_API_KEY. See the frontend AGENTS.md.
            - JELLYFIN_ENABLED=false
            # - JELLYFIN_SERVER_NAME=Riven
            # - JELLYFIN_USERNAME=riven
        ports:
            - "3000:3000"
        volumes:
            - ./frontend-data:/riven/data
        depends_on:
            riven:
                condition: service_started


    # Optional. Only needed if you switch on Settings -> VPN; the backend
    # works normally without this service, and everything except the streaming
    # -site scrapers always goes out directly regardless.
    #
    # Userspace networking is the whole reason this can be selective. In
    # kernel mode tailscaled would capture the backend's entire routing table
    # -- TPDB, the debrid provider, the indexers, the library scan -- and
    # there would be no way to route only the scrapers. Here it routes
    # nothing by itself and instead offers a SOCKS5 proxy that the backend
    # points selected traffic at.
    tailscale:
        image: tailscale/tailscale:latest
        container_name: riven-tailscale
        hostname: riven-tpdb
        restart: unless-stopped
        environment:
            - TS_USERSPACE=true
            - TS_STATE_DIR=/var/lib/tailscale
            # The image's default socket is /tmp/tailscaled.sock inside this
            # container, with /var/run/tailscale/tailscaled.sock left as a
            # symlink to it for host-mode compatibility. A symlink to a path
            # outside the shared volume is useless to another container --
            # confirmed live: the backend saw the link but nothing behind it.
            # Pinning the real socket into the shared directory is what makes
            # it actually reachable from riven-tpdb.
            - TS_SOCKET=/var/run/tailscale/tailscaled.sock
            # Bind on all interfaces: the backend reaches this over the
            # compose network, not from inside this container.
            - TS_SOCKS5_SERVER=0.0.0.0:1055
            - TS_OUTBOUND_HTTP_PROXY_LISTEN=0.0.0.0:1055
            # Leave unset to log in interactively from Settings -> VPN. An
            # auth key entered in the UI is stored by the backend instead, so
            # do not add a hardcoded fallback here.
            - TS_AUTHKEY=${TS_AUTHKEY:-}
            # riven-tpdb's own process runs as uid 1000 ("riven"), not root --
            # deliberately, that is the whole point of not running the app as
            # root. But tailscaled's local API rejects prefs WRITES (exit-node,
            # connect, disconnect; reads like status are unaffected) from any
            # caller that is not uid 0 or the configured "operator" -- and
            # confirmed live, `tailscale set --operator=<uid>` with a bare
            # numeric string is silently insufficient: tailscaled's own
            # checkprefs resolves the stored OperatorUser via THIS
            # container's own user database, so a plain digit string that is
            # not an actual username fails that lookup and the 403 persists,
            # with no error visible anywhere in Riven's logs. The entrypoint
            # below creates a matching user so `--operator=riven` resolves to
            # something real, on both ends -- exit-node changes made from the
            # VPN tab silently doing nothing (no error toast, state reverts
            # on reload) is exactly this failing quietly.
            #
            # containerboot runs its own `tailscale up` on every start, and
            # confirmed live, once ANY non-default flag (like operator) has
            # ever been set and persisted (./tailscale-state), every
            # subsequent start fails outright unless that flag is mentioned
            # again -- "changing settings via 'tailscale up' requires
            # mentioning all non-default flags". TS_EXTRA_ARGS is what
            # containerboot itself reads to build that call, so this is what
            # keeps every start self-consistent rather than fighting it with
            # a separate `tailscale set` afterwards.
            - TS_EXTRA_ARGS=--operator=riven
        volumes:
            - ./tailscale-state:/var/lib/tailscale
            # Shared so the backend can drive login and exit-node selection
            # over tailscaled's control socket. Without this the tunnel can
            # still come up from TS_AUTHKEY, but the VPN tab cannot manage it.
            - tailscale-sock:/var/run/tailscale
        # Deliberately no NET_ADMIN and no /dev/net/tun: userspace mode needs
        # neither, and granting them invites someone to "fix" it into kernel
        # mode later, which would silently route everything.
        #
        # Wraps the image's own entrypoint rather than replacing it, only to
        # add the one line the image has no hook for: a real "riven" user (uid
        # 1000, matching riven-tpdb's own image) so `--operator=riven` above
        # resolves to something real. The container's own filesystem is not
        # persisted, so this has to run on every start, not once -- harmless
        # and idempotent when the user already exists.
        entrypoint:
            - sh
            - -c
            - |
                adduser -D -u 1000 -H riven 2>/dev/null || true
                exec /usr/local/bin/containerboot

    # The other VPN option, for a commercial provider rather than your own
    # tailnet. Pick ONE of these two in Settings -> VPN -> provider; running
    # both containers is harmless, but only the selected one is used.
    #
    # Commented out because it needs real credentials to start at all, and a
    # service that crash-loops on every `docker compose up` is worse than one
    # that is not there. Uncomment, fill in the provider block, and set
    # provider to "gluetun".
    #
    # NOTE the same constraint as tailscale above, for the same reason: this
    # must NOT become riven-tpdb's `network_mode`. That is gluetun's usual
    # wiring and it would route the container's ENTIRE routing table --
    # TPDB, the debrid provider, the indexers, the library scan -- with no way
    # to send only the scrapers. HTTPPROXY is what makes it selective: gluetun
    # routes nothing by itself and offers a proxy the backend points chosen
    # traffic at, exactly like tailscale's SOCKS5 above.
    #
    # gluetun:
    #     image: qmcgaw/gluetun:latest
    #     container_name: riven-gluetun
    #     restart: unless-stopped
    #     cap_add:
    #         # Unavoidable here, unlike tailscale: gluetun brings up a real
    #         # tun interface inside its OWN network namespace. It still
    #         # cannot affect riven-tpdb's routing as long as this stays a
    #         # separate service rather than a network_mode.
    #         - NET_ADMIN
    #     devices:
    #         - /dev/net/tun:/dev/net/tun
    #     environment:
    #         # The proxy the backend actually sends routed traffic through.
    #         # Without this there is nothing to point at and the VPN tab
    #         # reports routing unavailable no matter how healthy the tunnel is.
    #         - HTTPPROXY=on
    #         - HTTPPROXY_LISTENING_ADDRESS=:8888
    #         # Status, start and stop for the VPN tab. Bound on all
    #         # interfaces because the backend reaches it over the compose
    #         # network, not from inside this container.
    #         - HTTP_CONTROL_SERVER_ADDRESS=:8000
    #         # Your provider's details. See gluetun's wiki for the exact
    #         # variables each provider wants -- they differ per provider.
    #         - VPN_SERVICE_PROVIDER=mullvad
    #         - VPN_TYPE=wireguard
    #         - WIREGUARD_PRIVATE_KEY=${GLUETUN_WG_KEY:-}
    #         - WIREGUARD_ADDRESSES=${GLUETUN_WG_ADDRESSES:-}
    #         # Where traffic comes out. Changed here and restarted, NOT from
    #         # the VPN tab -- gluetun reads this once at startup, which is why
    #         # the exit-node picker is not shown for this provider.
    #         - SERVER_COUNTRIES=${GLUETUN_COUNTRIES:-Sweden}

    riven_postgres:
        image: postgres:17-alpine
        container_name: riven-db
        environment:
            - PGDATA=/var/lib/postgresql/data/pgdata
            - POSTGRES_USER=postgres
            - POSTGRES_PASSWORD=postgres
            - POSTGRES_DB=riven
        volumes:
            - /path/to/riven/db:/var/lib/postgresql/data/pgdata
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres"]
            interval: 10s
            timeout: 5s
            retries: 5

    # OPTIONAL, and think before using it: this is a real Jellyfin pointed at
    # the Riven mount. Its library scan runs ffprobe over every file and seeks
    # through it for chapter images, and RivenVFS serves those bytes by
    # pulling them from your debrid provider -- a scheduled scan against a
    # debrid-backed mount hammers your own account, and the scraper will also
    # ignore the TPDB metadata Riven already has.
    #
    # To watch on a TV, prefer Settings -> Library -> Jellyfin server, which
    # makes Riven answer the Jellyfin protocol itself with no scanning at all.
    # See README.md ("Watching on a TV").
    jellyfin:
        image: jellyfin/jellyfin
        container_name: jellyfin
        user: 1000:1000
        restart: unless-stopped
        ports:
        - "8096:8096"
        volumes:
        - /path/to/jellyfin/config:/config
        - /path/to/riven/mount:/mount:rslave,z

volumes:
    # Carries only tailscaled's control socket between the two containers.
    tailscale-sock:
